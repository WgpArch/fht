site_name: SimpleWC Dotfiles
site_description: A minimal stacking Wayland compositor with a Warm Library theme.
theme:
  name: material
  palette:
    - scheme: slate
      primary: amber
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: amber
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode

nav:
  - Home: index.md
  - Installation: installation.md
  - Keybinds: keybinds.md
  - Theming: theming.md
  - Waybar: waybar.md
  - Gallery: gallery.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
